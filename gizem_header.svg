<svg width="800" height="120" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&display=swap');
      .letter{font-family:'Fira Code',monospace;font-size:72px;font-weight:700}
      .n1{fill:#38BDF8;animation:wave 1.8s ease-in-out 0s infinite}
      .n2{fill:#818CF8;animation:wave 1.8s ease-in-out 0.12s infinite}
      .n3{fill:#C084FC;animation:wave 1.8s ease-in-out 0.24s infinite}
      .n4{fill:#F472B6;animation:wave 1.8s ease-in-out 0.36s infinite}
      .n5{fill:#FB923C;animation:wave 1.8s ease-in-out 0.48s infinite}
      .n6{fill:#FACC15;animation:wave 1.8s ease-in-out 0.60s infinite}
      .n7{fill:#4ADE80;animation:wave 1.8s ease-in-out 0.72s infinite}
      .n8{fill:#38BDF8;animation:wave 1.8s ease-in-out 0.84s infinite}
      .n9{fill:#C084FC;animation:wave 1.8s ease-in-out 0.96s infinite}
      .n10{fill:#F472B6;animation:wave 1.8s ease-in-out 1.08s infinite}
      .n11{fill:#FACC15;animation:wave 1.8s ease-in-out 1.20s infinite}
      .n12{fill:#818CF8;animation:wave 1.8s ease-in-out 1.32s infinite}
